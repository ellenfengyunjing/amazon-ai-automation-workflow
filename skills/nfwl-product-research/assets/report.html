<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nfwl选品 / @@TITLE@@</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#203a32;font:15px/1.7 system-ui,'Microsoft YaHei',sans-serif}header{padding:36px max(4vw,20px);background:#173e34;color:#fff}main{max-width:1250px;margin:auto;padding:20px}h1{font-size:34px}h2{font-size:24px}section{margin:22px 0;padding:24px;background:#fff;border:1px solid #dce6de;border-radius:14px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:12px;text-align:left;border-bottom:1px solid #dde5df;vertical-align:top}th{background:#edf4ee}.insight{background:#f0f6f2;padding:16px;margin:15px 0;border-left:3px solid #57916f}.missing{color:#8d6424}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6f3;padding:15px;font-size:12px}details{margin:16px 0}summary{cursor:pointer;font-weight:600}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:15px 0}button,select{padding:9px 13px;background:#fff;border:1px solid #afc4b7;border-radius:7px}a{color:#32634d}#notice{font-size:12px;color:#77613c}@media(max-width:700px){main{padding:10px}section{padding:15px}h1{font-size:26px}}
</style></head><body><header><p>NFWL / PRODUCT RESEARCH</p><h1>选品报告与建议清单</h1><p>任务：@@TITLE@@ · 数据模式：@@MODE@@ · 人工待确认</p><p>公开估算、未知与测试数据分别标注。报告页不直接入库，不保证销量与收益。</p></header><main>@@BODY@@<p><a href="research_result.json">完整结果JSON</a> · <a href="recommendations.json">建议列表JSON</a> · <a href="recommendations.csv">CSV</a> · <a href="report.md">Markdown</a></p></main><script>
const meta=@@META@@;document.getElementById('filter').addEventListener('change',e=>document.querySelectorAll('[data-state]').forEach(r=>r.hidden=e.target.value!=='all'&&r.dataset.state!==e.target.value));
function payload(){const ids=[...document.querySelectorAll('input[type=checkbox]:checked:not(:disabled)')].map(x=>x.value);if(!ids.length){document.getElementById('notice').textContent='请先选择有资格的真实推荐；待验证/测试行不可确认';return null}return{type:'nfwl.research.selection',...meta,candidate_ids:ids,human_approval:'pending'}}
document.getElementById('download').onclick=()=>{const p=payload();if(!p)return;const u=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='research-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.getElementById('send').onclick=()=>{const p=payload();if(!p)return;if(parent===window){document.getElementById('notice').textContent='离线页面没有父窗口，尚未写入工作台';return}parent.postMessage(p,'*');document.getElementById('notice').textContent='已发送选择提案，等待父页面和后端复验及用户确认；未自动入库'};
</script></body></html>
