<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小清跨境 · 新品上架自动化工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#17233d;--ink:#0b1423;--ink2:#41536b;--ink3:#63748c;--ink4:#8a99ad;--ink5:#a9b5c6;
  --line:#e4eaf3;--line2:#eef2f8;--bg:#f4f7fc;--card:#fff;
  --blue:#2b5cff;--blues:#eaf0ff;--grn:#0b7a5b;--grns:#e6f6f0;
  --red:#be123c;--reds:#fdeaee;--amb:#9a5b00;--ambs:#fdf3e3;
  --pur:#6d3ac7;--purs:#f1ebfd;--cy:#0e7490;--cys:#e5f5f9;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.app{display:flex;height:100vh}

.side{width:228px;flex:0 0 228px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 16px 12px;border-bottom:1px solid var(--line2);display:flex;gap:9px;align-items:center}
.blogo{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex:0 0 26px}
.bname{font-size:13px;font-weight:700;line-height:1.2}
.bsub{font-size:9.5px;color:var(--ink4);margin-top:2px;letter-spacing:.3px}
.nav{flex:1;overflow:auto;padding:8px 8px 6px}
.nlab{font-size:10px;font-weight:700;color:var(--ink5);letter-spacing:.6px;padding:9px 8px 5px}
.nitem{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;
  font-size:12.5px;color:var(--ink2);margin-bottom:1px;position:relative;line-height:1.35}
.nitem:hover{background:#f5f8fe}
.nitem.on{background:var(--navy);color:#fff}
.nitem.on .ncount{background:rgba(255,255,255,.22);color:#fff}
.nitem .no{width:14px;flex:0 0 14px;font-size:10.5px;color:var(--ink5);font-variant-numeric:tabular-nums}
.nitem.on .no{color:rgba(255,255,255,.7)}
.nitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncount{min-width:17px;height:16px;padding:0 5px;border-radius:8px;background:#eef2f8;color:var(--ink3);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ncount.hot{background:var(--reds);color:var(--red)}
.ncount.done{background:var(--grns);color:var(--grn)}
.fbbtn{margin:8px 10px;padding:8px 10px;border:1px dashed #c5d2e6;border-radius:8px;font-size:12px;color:var(--ink2);
  display:flex;align-items:center;gap:7px;cursor:pointer;background:#fbfcfe;flex:0 0 auto}
.fbbtn:hover{border-color:var(--blue);color:var(--blue);background:#f4f8ff}
.sfoot{border-top:1px solid var(--line2);padding:9px 10px 11px}
.rolelab{font-size:10px;color:var(--ink5);font-weight:700;letter-spacing:.4px;margin:0 2px 6px}
.roles{display:flex;gap:4px;flex-wrap:wrap}
.rbtn{flex:1 1 auto;padding:5px 6px;border-radius:6px;border:1px solid var(--line);font-size:11px;color:var(--ink3);background:#fff;text-align:center}
.rbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.rbtn:hover:not(.on){border-color:#c9d5e8}

.shell{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:50px;flex:0 0 50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:10px;padding:0 18px;z-index:20}
.tb-t{font-size:13px;font-weight:700}
.tb-s{font-size:11px;color:var(--ink4);padding-left:10px;border-left:1px solid var(--line);margin-left:2px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:7px}
.main{flex:1;overflow:auto;padding:0 0 24px;min-height:0}
/* v11: 冻结区（模块标题 + 步骤导航 sticky） */
.mhead{position:sticky;top:0;z-index:15;background:var(--bg);padding:14px 18px 0;border-bottom:1px solid var(--line);
  box-shadow:0 3px 8px rgba(23,35,61,.04)}
.mbody{padding:13px 18px 24px}
.shead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.shead h1{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.shead .smeta{font-size:11.5px;color:var(--ink3);margin-top:3px}
.shead .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sub{display:flex;align-items:center;gap:0;background:#fff;border:1px solid var(--line);border-radius:8px 8px 0 0;
  padding:8px 12px;overflow-x:auto;margin-bottom:-1px;position:relative;z-index:2}
.sub.solo{border-radius:8px}
.sub .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink4);cursor:pointer;
  white-space:nowrap;padding:2px 0;flex:0 0 auto}
.sub .st:hover{color:var(--ink2)}
.sub .st .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #d3dcea;display:flex;align-items:center;
  justify-content:center;font-size:9.5px;font-weight:700;color:var(--ink4);flex:0 0 16px}
.sub .st.cur{color:var(--navy);font-weight:700}
.sub .st.cur .dot{background:var(--navy);border-color:var(--navy);color:#fff}
.sub .st.done{color:var(--grn)}
.sub .st.done .dot{background:var(--grns);border-color:#a9dbc9;color:var(--grn)}
.sub .ln{flex:0 0 22px;height:1px;background:#dde5f0;margin:0 8px}
.subhint{margin-left:auto;padding-left:12px;font-size:10px;color:var(--ink5);white-space:nowrap;flex:0 0 auto}
/* v11: 底部下一步指引条（冻结） */
.foot{height:46px;flex:0 0 46px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 18px;z-index:20}
.foot .fi{width:15px;height:15px;border-radius:50%;background:var(--blues);color:#1a3fd0;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:0 0 15px}
.foot .ft{font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot .ft b{color:var(--ink);font-weight:700}
.foot .fr{margin-left:auto;display:flex;gap:7px;align-items:center;flex:0 0 auto}

.btn{height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12px;
  color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:.12s}
.btn:hover{border-color:#c5d2e6;background:#fafcff}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.btn.p:hover{background:#22304f}
.btn.g{background:var(--grn);color:#fff;border-color:var(--grn);font-weight:600}
.btn.g:hover{background:#0a6b50}
.btn.d{background:#fff;color:var(--red);border-color:#f3c3cc}
.btn.d:hover{background:var(--reds)}
.btn.s{height:24px;padding:0 8px;font-size:11px;border-radius:5px}
.btn.xs{height:21px;padding:0 7px;font-size:10.5px;border-radius:4px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--blues);border-color:#bcd0ff;color:#1a3fd0;font-weight:600}
.pill{height:19px;padding:0 7px;border-radius:4px;font-size:10.5px;font-weight:600;display:inline-flex;
  align-items:center;gap:3px;white-space:nowrap}
.p-ok{background:var(--grns);color:var(--grn)}
.p-do{background:var(--blues);color:#1a3fd0}
.p-wait{background:var(--ambs);color:var(--amb)}
.p-bad{background:var(--reds);color:var(--red)}
.p-mute{background:#eef2f8;color:var(--ink3)}
.p-pur{background:var(--purs);color:var(--pur)}
.p-cy{background:var(--cys);color:var(--cy)}
.inp{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:12px;width:100%;outline:none}
.inp:focus{border-color:#9fb8e8;box-shadow:0 0 0 2px rgba(43,92,255,.09)}
.inp.s{height:24px;font-size:11px;padding:0 5px}
textarea.inp{height:auto;padding:7px 8px;line-height:1.55;resize:vertical}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><path d='M0 0h8L4 5z' fill='%238a99ad'/></svg>");
  background-repeat:no-repeat;background-position:right 6px center;padding-right:18px}
.cbx{width:14px;height:14px;border:1.5px solid #c5d2e6;border-radius:3.5px;background:#fff;display:inline-flex;
  align-items:center;justify-content:center;flex:0 0 14px;cursor:pointer;position:relative}
.cbx.on{background:var(--blue);border-color:var(--blue)}
.cbx.on::after{content:"";width:4px;height:7px;border:1.5px solid #fff;border-top:0;border-left:0;transform:rotate(42deg) translate(-1px,-1px)}
.tip{display:flex;gap:8px;padding:8px 11px;border-radius:7px;font-size:11.5px;line-height:1.6;align-items:flex-start}
.tip .ico{width:14px;height:14px;border-radius:50%;background:currentColor;color:#fff;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:0 0 14px;margin-top:1px}
.tip.b{background:var(--blues);color:#25459e}
.tip.g{background:var(--grns);color:#0a6b50}
.tip.w{background:var(--ambs);color:#8a5200}
.mb10{margin-bottom:10px}.mt10{margin-top:10px}
.rowline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dim{color:var(--ink4)}.sm{font-size:11.5px}.xs{font-size:11px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

.card{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.card+.card{margin-top:11px}
.card>h3{font-size:12.5px;font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:8px;line-height:1.3}
.card>h3 .n{font-size:10.5px;font-weight:600;color:var(--ink4);background:#f2f6fc;border-radius:4px;padding:2px 6px}
.card>h3 .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.cb{padding:13px 14px}
.cb.tight{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:1180px){.grid2,.grid3{grid-template-columns:1fr}}

.tbl{width:100%}
.tr{display:grid;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line2);min-height:46px}
.tr.th{min-height:34px;background:#f8fafd;border-bottom:1px solid var(--line);font-size:10.5px;
  font-weight:700;color:var(--ink4);letter-spacing:.2px}
.tr:last-child{border-bottom:none}
.tr.body:hover{background:#fafcff}
.tr.gray{opacity:.55}
.sku{display:flex;gap:8px;align-items:center;min-width:0}
.sku .ph{width:32px;height:32px;border-radius:5px;background:linear-gradient(135deg,#e8eef8,#d5e0f0);flex:0 0 32px;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:#8fa3bd;font-weight:700}
.sku .nm{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sku .cd{font-size:10px;color:var(--ink4);margin-top:2px;font-family:ui-monospace,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trfoot{padding:9px 14px;font-size:11px;color:var(--ink4);display:flex;gap:9px;align-items:center;
  background:#fbfcfe;border-top:1px solid var(--line2)}
.xrow{grid-column:1/-1;background:#f8fafd;border-bottom:1px solid var(--line2);padding:11px 14px 11px 56px}
.xrow .xg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 14px}
.xrow .xf{font-size:10.5px;line-height:1.5}
.xrow .xf b{display:block;color:var(--ink4);font-weight:600;font-size:9.5px;margin-bottom:1px}
.xrow .xf span{color:var(--ink2);font-weight:600}
.xdots{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
.xdots .xd{display:flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:9px;background:#fff;border:1px solid var(--line2)}
.xdots .xd i{width:7px;height:7px;border-radius:50%;display:inline-block}
.xdots .xd.done{color:#0b7a5b}.xdots .xd.done i{background:#12a06a}
.xdots .xd.doing{color:#1a3fd0}.xdots .xd.doing i{background:#3d6dff}
.xdots .xd.rej{color:#be123c;background:#fffafa;border-color:#f3c3cc}.xdots .xd.rej i{background:#e5484d}
.xdots .xd.wait{color:var(--ink4)}.xdots .xd.wait i{background:#c5d2e6}
.expbtn{cursor:pointer;user-select:none}

/* v11: 多维表格单元格（卖点 / Listing / 说明书 AI 生成字段） */
.mcell{padding:8px 0;min-width:0}
.mcell .mc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.mcell .mc-name{font-size:11px;font-weight:700;color:var(--pur)}
.mcell .mc-st{font-size:10px}
.mcell .mc-body{font-size:11px;color:var(--ink2);line-height:1.6;border:1px solid var(--line2);border-radius:6px;
  background:#fbfcfe;padding:7px 9px;cursor:pointer;transition:.12s;position:relative}
.mcell .mc-body:hover{border-color:#c5b3f2;background:#faf9ff}
.mcell .mc-body .mtxt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mcell .mc-body .mop{margin-top:5px;font-size:10px;color:var(--pur);font-weight:600}
.langrow{display:flex;gap:4px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:2px 9px;
  font-size:10.5px;font-weight:600;color:var(--ink3);cursor:pointer;background:#fff}
.lchip:hover{border-color:#9dbaff;color:#1a3fd0}
.lchip.on{background:var(--blues);border-color:#9dbaff;color:#1a3fd0}
.prow{display:flex;gap:5px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line2)}
.prow:last-child{border-bottom:none}
.prow .pl2{width:30px;flex:0 0 30px;font-size:10px;font-weight:700;color:var(--ink4);font-family:ui-monospace,monospace}
.prow .pt2{flex:1;min-width:0;font-size:11px;line-height:1.55;color:var(--ink2)}

/* v11: 图表 */
.chart{display:flex;flex-direction:column;gap:8px}
.spark{display:flex;align-items:flex-end;gap:7px;height:118px;padding-top:6px}
.spark .sb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.spark .sb i{width:100%;max-width:56px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#8fb0ff,#2b5cff);min-height:2px;flex:0 0 auto}
.spark .sb b{font-size:9.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.spark .sb span{font-size:9px;color:var(--ink4);white-space:nowrap}
.brow{display:grid;grid-template-columns:104px 1fr 52px;gap:9px;align-items:center;font-size:11.5px}
.brow .bl{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{height:15px;border-radius:4px;background:#f1f5fb;overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .4s}
.brow .bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px}
.brow .bv small{font-weight:600;color:var(--ink4);font-size:10px;margin-left:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.kpi .l{font-size:10.5px;color:var(--ink4);font-weight:600;margin-bottom:5px}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.6px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;font-weight:600;color:var(--ink4);margin-left:2px}
.kpi .m{font-size:10.5px;color:var(--ink4);margin-top:5px}

/* v11: AI 过程折叠区 */
.fold{grid-column:1/-1;background:#fbfcfe;border-bottom:1px solid var(--line2)}
.fold-h{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 56px;cursor:pointer;font-size:11px;color:var(--ink3);font-weight:600}
.fold-h:hover{color:var(--ink)}
.fold-h .arr{transition:.15s;font-size:9px;color:var(--ink5)}
.fold-h.open .arr{transform:rotate(90deg)}
.fold-b{padding:2px 14px 12px 56px;display:none}
.fold.open .fold-b{display:block}
.fold.open .fold-h{color:var(--ink)}
.runlogs{font-size:10.5px;line-height:1.9;color:var(--ink3);font-family:ui-monospace,monospace;border:1px solid var(--line2);
  border-radius:7px;background:#fff;padding:9px 12px}
.bar{height:4px;background:#eef2f8;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.runlogs b{color:#1a3fd0;font-weight:700}
.runlogs .ok{color:var(--grn);font-weight:600}
.runlogs .ai{color:var(--pur);font-weight:600}

/* v11: 生图工作台（参考附件样式） */
.gtabs{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;width:max-content}
.gtab2{padding:7px 18px;font-size:12px;font-weight:600;color:var(--ink3);cursor:pointer;display:flex;gap:6px;align-items:center}
.gtab2+.gtab2{border-left:1px solid var(--line)}
.gtab2.on{background:var(--navy);color:#fff}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:1100px){.gstats{grid-template-columns:repeat(2,1fr)}}
.gstat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;display:flex;gap:10px;align-items:center}
.gstat .gi{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 34px}
.gstat .gl{font-size:10.5px;color:var(--ink4);font-weight:600}
.gstat .gv{font-size:19px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.gstat .gv small{font-size:10px;color:var(--ink4);font-weight:600}
.task{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.task+.task{margin-top:11px}
.task-h{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.task-h .tk-sku{display:flex;gap:8px;align-items:center;min-width:0}
.task-h .tk-sku .ph{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#e8eef8,#d5e0f0);
  display:flex;align-items:center;justify-content:center;font-size:9px;color:#8fa3bd;font-weight:700;flex:0 0 30px}
.task-h .tk-nm{font-size:12.5px;font-weight:700;max-width:280px}
.task-h .tk-cd{font-size:10px;color:var(--ink4);font-family:ui-monospace,monospace}
.task-h .tk-meta{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.task-sub{display:flex;gap:5px;padding:7px 13px 0;flex-wrap:wrap;align-items:center}
.tsub{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:2px 10px;
  font-size:10.5px;font-weight:600;color:var(--ink3);cursor:pointer;background:#fff}
.tsub.on{background:var(--blues);border-color:#9dbaff;color:#1a3fd0}
.tsub .tc{font-size:9.5px;color:var(--ink5)}
.tsub.on .tc{color:#1a3fd0}
.task-g{padding:10px 13px 13px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:linear-gradient(140deg,#e9eff9,#d7e2f2);
  aspect-ratio:1;cursor:pointer}
.thumb:hover{border-color:#bcd0ff}

function vGen(){
  const tasks=modsk('gen').filter(function(s){ return canStart(s,'gen') && (atOf(s,'gen')>0||gimgs(s).length); });
  let h='<div class="rowline mb10"><div class="gtabs">'+
    '<div class="gtab2'+(S.gtab==='bench'?' on':'')+'" data-act="gtab" data-t="bench">🖼 AI 生图工作台</div>'+

    (S.gtab==='bench'?'<span class="xs dim">确认 ⑥ 需求后自动创建生图任务 · 按语种和图片类型批量生成</span>':
     '<span class="xs dim">已确认入库的 SKU 图片 · 支持批量下载 · 自动流转 ⑦ 上架</span>')+'</div>';
  h+= S.gtab==='bench' ? genBench(tasks) : genLib();
  return h;
}
function genBench(tasks){
  const total=tasks.reduce(function(a,s){return a+gimgs(s).length;},0);
  const okg=tasks.reduce(function(a,s){return a+gimgs(s).filter(function(g){return g.st==='ok';}).length;},0);
  const waitg=tasks.reduce(function(a,s){return a+gimgs(s).filter(function(g){return g.st==='wait';}).length;},0);
  let h='<div class="gstats mb10">'+
    gstat('🎨','今日生成',total+'<small> 张</small>','#eaf0ff')+
    gstat('✅','已通过',okg+'<small> 张</small>','#e6f6f0')+
    gstat('⏳','待审核',waitg+'<small> 张</small>','#fdf3e3')+
    gstat('📦','已入库',okg+'<small> 张</small>','#f1ebfd')+'</div>';
  if(!tasks.length) return h+'<div class="card"><div class="empty"><div class="e1">暂无生图任务</div><div class="e2">在 ⑤ 图片需求表确认需求后自动创建</div></div></div>';
  tasks.forEach(function(s){
    const imgs=gimgs(s), prog=G_STAT[s.id]==='ok'?100:Math.round((G_DOING[s.id]||0)*100);
    const okn=imgs.filter(function(g){return g.st==='ok';}).length;
    const langs=[...new Set(imgs.map(function(g){return g.lang;}))];
    h+='<div class="task"><div class="task-h">'+
      '<div class="tk-sku"><div class="ph">IMG</div><div><div class="tk-nm ell">'+esc(s.name)+'</div>'+
      '<div class="tk-cd">'+esc(s.code)+' · '+esc(s.asin)+'</div></div></div>'+
      '<div class="tk-meta">'+
      (prog===100?'<span class="pill p-ok">已完成 '+okn+'/'+imgs.length+'</span>':'<span class="pill p-do">生成中 '+prog+'%</span>')+
      '<span class="pill p-mute">'+langs.join(' / ')+'</span>'+
      '<button class="btn xs" data-act="gselall" data-id="'+s.id+'">全选</button>'+
      '</div></div>'+
      '<div class="task-sub">'+langs.map(function(l){
        const ci=imgs.filter(function(g){return g.lang===l;}).length;
        return '<span class="tsub'+(S.glang===l||!S.glang&&l===langs[0]?' on':'')+'" data-act="glang" data-l="'+l+'">'+l+'<span class="tc">'+ci+' 张</span></span>';
      }).join('')+'<span class="xs dim" style="margin-left:4px">参考图：实拍 9 张（一致性锁定）</span></div>'+
      '<div class="task-g"><div class="tgrid">'+imgs.map(function(g,i){
        return genThumb(s,g,i);
      }).join('')+'</div></div></div>';
  });
  return h;
}
function genThumb(s,g,i){
  const sel=S.gsel.has(s.id+'-'+i);
  const st = g.st==='ok'?'p':(g.st==='todo'?'w':'n');
  const stlb = g.st==='ok'?'待审':(g.st==='todo'?'待生成':'排队');
  return '<div class="thumb'+(sel?' sel':'')+'" data-act="gsel" data-id="'+s.id+'-'+i+'">'+
    (g.st==='wait'?'':'<span class="cat">'+g.type+' · '+g.lang+'</span>')+
    (sel?'':'<span class="st3 '+st+'">'+stlb+'</span>')+
    (g.st==='ok'?'<div class="acts2"><button class="btn" data-act="g1regen" data-id="'+s.id+'-'+i+'">重新生成</button>'+
      '<button class="btn" data-act="g1dl" data-id="'+s.id+'-'+i+'">下载</button>'+
      '<button class="btn" data-act="g1ok" data-id="'+s.id+'-'+i+'">✓ 通过</button></div>':
     g.st==='todo'?'<div class="acts2"><button class="btn" data-act="g1gen" data-id="'+s.id+'-'+i+'">生成</button></div>':'')+
    '<span class="ck"><span class="cbx'+(sel?' on':'')+'"></span></span>'+
    '<div class="tb2"><span>'+g.type+'</span><span>'+g.lang+'</span></div></div>';
}
function gstat(ico,l,v,bg){
  return '<div class="gstat"><div class="gi" style="background:'+bg+'">'+ico+'</div><div><div class="gl">'+l+'</div><div class="gv">'+v+'</div></div></div>';

/* =========================================================
   20. 交互事件
   ========================================================= */
document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]');
  if(!el) { if(ev.target.id==='mask'){ closeModal(); } return; }
  const a=el.dataset.act, id=el.dataset.id;
  const go=function(k){ S.m=MI(k); S.step=0; S.sel.clear(); S.gsel.clear(); S.drw=null; S.lpop=null; render(); };
  const s=id?sk(id):null;
  /* v13: 点击下拉多选外部 → 收起 */
  if(S.lpop!==null && !ev.target.closest('.lsel')){ S.lpop=null; render(); }

  if(a==='goto'){ go(el.dataset.k); return; }
  if(a==='role'){ S.role=el.dataset.r; render(); return; }
  if(a==='reset'){ location.reload(); return; }
  if(a==='step'){ S.step=+el.dataset.i; S.lpop=null; render(); return; }
  if(a==='stepnext'){ S.step=Math.min(S.step+1,(M(MODS[S.m].k).steps.length-1)); S.lpop=null; render(); return; }
  if(a==='stepprev'){ S.step=Math.max(0,S.step-1); S.lpop=null; render(); return; }
  if(a==='exp'){ if(S.exp.has(id)) S.exp.delete(id); else S.exp.add(id); render(); return; }
  if(a==='sel'){ if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); render(); return; }
  if(a==='selR'){ if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); render(); return; }

  /* v13: 详情抽屉 */
  if(a==='drw'){ openDrw(el.dataset.k, id); return; }
  if(a==='drwclose'){ S.drw=null; render(); return; }
  /* v13: 语种 / 类型 下拉多选 */
  if(a==='lpop'){ const key=(el.dataset.mod||'lang')+':'+id;
    S.lpop = S.lpop===key ? null : key; render(); return; }
  if(a==='lset'){ const m=S.langs[el.dataset.mod]; m[id]=m[id]||DEF_LANGS.slice();
    const i=m[id].indexOf(el.dataset.l); i>=0?m[id].splice(i,1):m[id].push(el.dataset.l);
    if(!m[id].length) m[id]=['EN']; render(); return; }
  if(a==='tset'){ S.types[id]=S.types[id]||IMGTYPES.filter(function(t){return t[2];}).map(function(t){return t[0];});
    const i=S.types[id].indexOf(el.dataset.t); i>=0?S.types[id].splice(i,1):S.types[id].push(el.dataset.t);
    if(!S.types[id].length) S.types[id]=IMGTYPES.filter(function(t){return t[2];}).map(function(t){return t[0];});
    render(); return; }
  if(a==='lclose'){ S.lpop=null; render(); return; }
  /* v13: 分页 */
  if(a==='pgp'){ const k=el.dataset.k; S.pg[k]=Math.max(1,(S.pg[k]||1)-1); render(); return; }
  if(a==='pgn2'){ const k=el.dataset.k; S.pg[k]=(S.pg[k]||1)+1; render(); return; }
  /* v13: 抽屉 → 完整报告直达 */
  if(a==='cview2report'){ S.cview='report'; S.csel=id; S.drw=null; render(); return; }
  if(a==='lang'){ const m=S.langs[el.dataset.mod]; m[id]=m[id]||DEF_LANGS.slice();
    const i=m[id].indexOf(el.dataset.l); i>=0?m[id].splice(i,1):m[id].push(el.dataset.l);
    if(!m[id].length) m[id]=['EN']; render(); return; }
  if(a==='type'){ S.types[id]=S.types[id]||IMGTYPES.filter(function(t){return t[2];}).map(function(t){return t[0];});
    const i=S.types[id].indexOf(el.dataset.t); i>=0?S.types[id].splice(i,1):S.types[id].push(el.dataset.t); render(); return; }
  if(a==='mclose'||a==='mcloseok'){ if(a==='mcloseok') toast('已保存','ok'); closeModal(); return; }
  if(a==='toast'){ toast(el.dataset.t); return; }

  /* 商品池 */
  if(a==='confirmS'){ s.at.accept=1; toast('已确认选品 → 自动流转 ① 样品验收','ok'); render(); return; }
  if(a==='confirmSel'){ S.sel.forEach(function(x){ sk(x).at.accept=sk(x).at.accept||1; }); const n=S.sel.size;
    S.sel.clear(); toast('批量确认 '+n+' 个 SKU → 流转 ① 样品验收','ok'); render(); return; }
  if(a==='goto1'){ go('accept'); return; }
  if(a==='newSku'){ toast('新建商品（演示）：必填 = 名称 / ASIN / 类目 / 站点 / 售价 / 负责人'); return; }

  /* 选品调研 */
  if(a==='impR'||a==='impSel'){ const ids=a==='impR'?[id]:Array.from(S.sel);
    ids.forEach(function(x){ const r=RESEARCH.find(function(y){return y.asin===x;});
      if(r && !sk(r.asin)){ SK.push({id:'N'+SK.length,code:'2410-0'+(60+SK.length),name:r.name,asin:r.asin,
        cat:'家居 › 挂钩',market:'US',price:r.price,sales:r.sales,score:r.score,owner:'Ellen',at:{},poolOnly:true,size:'—',wt:'—'}); } });
    S.sel.clear(); toast('已导入商品池，请在商品池「确认选品」','ok'); render(); return; }
  if(a==='holdR'){ toast('已标记暂不考虑'); return; }
  if(a==='editR'){ toast('修改调研建议（演示）'); return; }

  /* ① 验收 */
  if(a==='fillD'){ S.fshots=[]; S.fillId=id; openModal(fillModal(id)); return; }
  if(a==='fillSave'){ s.filled=true; s.at.accept=Math.max(s.at.accept,2); s.rej=null;
    closeModal(); toast('资料已保存，必备字段标签已转绿 → 可审核通过','ok'); render(); return; }
  if(a==='upshot'){ S.fshots.push('截图-'+(S.fshots.length+1)+'.png');
    openModal(S.fbopen?feedbackModal():fillModal(S.fillId)); return; }
  if(a==='delshot'){ S.fshots=S.fshots.filter(function(x){return x!==el.dataset.f;});
    openModal(S.fbopen?feedbackModal():fillModal(S.fillId)); return; }
  if(a==='passA'||a==='passSel'){ const ids=a==='passA'?[id]:Array.from(S.sel);
    ids.forEach(function(x){ const t=sk(x); if(missCount(t)===0&&!t.stop&&!t.rej){ t.at.accept=3; t.at.sp=1; } });
    if(a==='passSel') S.sel.clear();
    toast('审核通过 ✓ AI 已开始生成卖点 / Listing / 说明书 / 图片素材（流转 ②③④⑤）','ok'); render(); return; }
  if(a==='feishu1'||a==='feishuSel'){ toast('已通过飞书机器人通知负责人：缺 XX 项资料，需 7 天内补齐','ok'); return; }

  /* ② 卖点 */
  if(a==='spgen'||a==='spbatch'){ const ids=a==='spgen'?[id]:Array.from(S.sel);
    ids.forEach(function(x){ sk(x).at.sp=1; });
    if(a==='spbatch') S.sel.clear();
    toast('已调用绑定模型生成多语种卖点（GPT-4o · Skill: sp-gen）','ok'); render(); return; }
  if(a==='spv'){ openModal(spModal(id)); return; }
  if(a==='pedit'){ openModal(spModal(id)); return; }
  if(a==='spsave'||a==='sppass'){ if(a==='sppass'){ s.at.sp=1; }
    closeModal(); toast(a==='sppass'?'卖点已确认 ✓ SKU 与卖点流转 ③ Listing / ④ 说明书 / ⑤ 图片需求表':'卖点修改已保存','ok'); render(); return; }

  /* ③ Listing */
  if(a==='cpygen'||a==='cpybatch'){ openModal({t:'重新生成 Listing',w:'',b:
    '<div class="fld"><label>修改指令 <span>（可选：AI 根据指令二次生成）</span></label>'+
    '<textarea class="inp" rows="3" placeholder="例：标题更短促有力，五点第一条放承重数据"></textarea></div>',
    f:'<button class="btn" data-act="mclose">取消</button><button class="btn p" data-act="cpyrun" data-id="'+(id||'')+'">后台重新生成</button>'}); return; }
  if(a==='cpyrun'){ const ids=id?sk(id)&&[id]:Array.from(S.sel);
    (ids||[]).forEach(function(x){ sk(x).at.copy=1; }); S.sel.clear(); closeModal();
    toast('AI 已在后台重跑 Listing 工作流（埋词分析 → 策略 → 文案），结果覆盖原内容','ok'); render(); return; }
  if(a==='cpyv'||a==='cpyv2'){ openModal(cpyModal(id)); return; }
  if(a==='cpysave'){ closeModal(); toast('Listing 修改已保存','ok'); render(); return; }
  if(a==='cpypass'){ s.at.copy=1; toast('Listing 审核通过 ✓ 流转 ⑦ 上架','ok'); render(); return; }

  /* ④ 说明书 */
  if(a==='mnv'||a==='mnv2'){ S.pg=1; openModal(mnModal(id)); return; }
  if(a==='pgv'){ S.pg=+el.dataset.p; openModal(mnModal(id)); return; }
  if(a==='dlpg'){ toast('说明书 PDF 已开始下载','ok'); return; }
  if(a==='mngen'||a==='mnbatch'){ const ids=a==='mngen'?[id]:Array.from(S.sel);
    ids.forEach(function(x){ sk(x).at.manual=1; }); if(a==='mnbatch') S.sel.clear();
    toast('AI 已重新生成说明书（图文排版 + 多语种）','ok'); render(); return; }
  if(a==='mnpass'){ s.at.manual=1; toast('说明书已确认入库 ✓ 流转 ⑦ 上架','ok'); render(); return; }

  /* ⑤ 图片需求表 */
  if(a==='briefe'){ toast('修改需求（演示）：可调整语种与图片类型后保存'); return; }
  if(a==='briefok'){ s.at.brief=1; toast('需求已确认 ✓ 产品信息与图片要求流转 ⑥ AI 批量生图','ok'); render(); return; }

  /* ⑥ 生图 */
  if(a==='gtab'){ S.gtab=el.dataset.t; S.gsel.clear(); render(); return; }
  if(a==='glang'){ S.glang=el.dataset.l; render(); return; }
  if(a==='gsel'){ if(S.gsel.has(id)) S.gsel.delete(id); else S.gsel.add(id); render(); return; }
  if(a==='gselall'){ const sid=id; const imgs=gimgs(sk(sid));
    const all=imgs.every(function(g,i){ return S.gsel.has(sid+'-'+i); });
    imgs.forEach(function(g,i){ all?S.gsel.delete(sid+'-'+i):S.gsel.add(sid+'-'+i); }); render(); return; }
  if(a==='g1regen'){ toast('该图已加入重新生成队列','ok'); return; }
  if(a==='g1gen'){ toast('已开始生成','ok'); return; }
  if(a==='g1dl'){ toast('图片已开始下载','ok'); return; }
  if(a==='g1ok'){ toast('已通过并入库图片库，同步 ⑦ 上架','ok'); render(); return; }
  if(a==='gbRegen'){ toast('已批量重新生成 '+S.gsel.size+' 张（引用实拍参考图）','ok'); return; }
  if(a==='gbDl'){ toast('已批量下载 '+S.gsel.size+' 张至本地','ok'); return; }
  if(a==='gbOk'){ toast('批量通过 '+S.gsel.size+' 张 → 入库图片库并流转 ⑦ 上架','ok'); S.gsel.clear(); render(); return; }
  if(a==='gbAgent'){ openModal(agentModal()); return; }
  if(a==='agentsub'){ closeModal(); toast('已发送给 Agent：按指令修改提示词并引用产品图二次生图','ok'); return; }

  /* ⑦ 上架 */
  if(a==='cview'){ S.cview=el.dataset.v; render(); return; }
  if(a==='csel'){ S.csel=id; render(); return; }
  if(a==='amzv'||a==='amzEdit'){ openModal(amzModal(id)); return; }
  if(a==='amzsave'){ closeModal(); toast('上架信息已保存（基础信息 + Listing + 图片 + 说明书）','ok'); render(); return; }
  if(a==='amzdel'){ s.at={}; s.poolOnly=true; toast('已删除该 SKU 的上架数据','ok'); render(); return; }
  if(a==='exportS'){ toast('已导出上架表格 Excel（含全部字段：Listing / 图片 / 说明书 / 规格 / 价格）','ok'); return; }

  /* 反馈 */
  if(a==='feedback'){ S.fbopen=true; S.fshots=[]; openModal(feedbackModal()); return; }
  if(a==='fbsub'){ const t=$('#fbTxt'); closeModal();
    toast('反馈已提交 ✓ 飞书机器人已通知 Ellen'+(S.fshots.length?'（含 '+S.fshots.length+' 张截图）':''),'ok'); S.fbopen=false; return; }
});
$('#mask').addEventListener('click',function(ev){ if(ev.target===ev.currentTarget) closeModal(); });
$('#drwmask').addEventListener('click',function(){ S.drw=null; render(); });

render();
</script>
</body>
</html>
